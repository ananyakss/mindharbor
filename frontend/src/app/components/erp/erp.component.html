<div class="page">
  <a routerLink="/therapy" class="sub-back">← Therapy modules</a>
  <h1 class="page-title">ERP log 🌊</h1>
  <p class="page-sub">Exposure with response prevention — note anxiety, what you tried, and how it felt after.</p>

  <div class="card form-card" *ngIf="!loading()">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Date <input type="date" formControlName="date" /></label>
      <label>Trigger <textarea rows="3" formControlName="trigger"></textarea></label>
      <label>Anxiety level (1–10) <input type="number" min="1" max="10" formControlName="anxietyLevel" /></label>
      <label>Exposure activity <textarea rows="3" formControlName="exposureActivity"></textarea></label>
      <label class="check">
        <input type="checkbox" formControlName="resistedCompulsion" />
        I resisted the compulsion 🌱
      </label>
      <label>Reflection <textarea rows="4" formControlName="reflection"></textarea></label>
      <div class="actions">
        <button class="btn btn-primary" type="submit" [disabled]="saving()">
          {{ editingId() ? 'Update' : 'Save' }} ✨
        </button>
        <button *ngIf="editingId()" type="button" class="btn btn-ghost" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>

  <p *ngIf="error()" class="error">{{ error() }}</p>

  <section *ngIf="entries().length">
    <h2>History 📚</h2>
    <div class="card entry" *ngFor="let e of entries()">
      <div class="pill-row">
        <span class="pill">{{ e.date | date: 'mediumDate' }}</span>
        <span class="pill soft">Anxiety {{ e.anxietyLevel }}/10</span>
      </div>
      <p class="snippet">{{ e.trigger | slice: 0 : 120 }}{{ e.trigger.length > 120 ? '…' : '' }}</p>
      <div class="actions">
        <button type="button" class="btn btn-ghost" (click)="editEntry(e)">Edit</button>
        <button type="button" class="btn btn-ghost" (click)="deleteEntry(e.id)">Delete</button>
      </div>
    </div>
  </section>
</div>
