<div class="page">
  <a routerLink="/therapy" class="sub-back">← Therapy modules</a>
  <h1 class="page-title">Abandonment / emotional deprivation 🫂</h1>

  <p *ngIf="loading()" class="loading-hint">Loading saved worksheets…</p>

  <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="submit()" class="card worksheet">
    <label>When do I feel unsupported? <textarea formControlName="whenUnsupported" rows="2"></textarea></label>
    <label>What do I expect from others? <textarea formControlName="expectFromOthers" rows="2"></textarea></label>
    <label>What actually happened? <textarea formControlName="whatActuallyHappened" rows="2"></textarea></label>
    <hr />
    <label>Trigger <textarea formControlName="trigger" rows="2"></textarea></label>
    <label>Core belief <textarea formControlName="coreBelief" rows="2"></textarea></label>
    <label>Emotional response <textarea formControlName="emotionalResponse" rows="2"></textarea></label>
    <label>Coping behavior <textarea formControlName="copingBehavior" rows="2"></textarea></label>
    <label>Healthier alternative belief <textarea formControlName="healthierAlternativeBelief" rows="2"></textarea></label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit" [disabled]="saving()">
        {{ editingId() ? 'Update' : 'Save' }} ✨
      </button>
      <button *ngIf="editingId()" type="button" class="btn btn-ghost" (click)="cancelEdit()">Cancel edit</button>
    </div>
    <p *ngIf="message()" class="msg">{{ message() }}</p>
  </form>

  <p *ngIf="error()" class="error">{{ error() }}</p>

  <section class="list" *ngIf="entries().length">
    <h2>Past entries 📚</h2>
    <div class="card entry" *ngFor="let e of entries()">
      <div class="pill-row">
        <span class="pill">{{ e.createdAt | date: 'medium' }}</span>
      </div>
      <p class="snippet">
        {{ e.trigger | slice: 0 : 140 }}{{ e.trigger.length > 140 ? '…' : '' }}
      </p>
      <div class="row">
        <button type="button" class="btn btn-ghost" (click)="editEntry(e)">Review / edit</button>
        <button type="button" class="btn btn-ghost" (click)="deleteEntry(e.id)">Delete</button>
      </div>
    </div>
  </section>
</div>
